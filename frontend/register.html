<section class="py-5 bg-light">

                    <div class="card-body p-4 p-md-5">


                        <!-- Heading -->

                                    class="fa-solid fa-user-plus text-primary fa-3x"

                            <p class="text-muted">

                                Register to start your career assessment

                        </div>



                        <!-- ================= FORM ================= -->

                        <form id="registrationForm">


                            <!-- NAME -->

                            <div class="mb-3">

                                <label
                                    for="fullName"
                                    class="form-label fw-semibold"
                                >

                                </label>

                                    </span>


                                    <input
                                        type="text"
                                        class="form-control"
                                        id="fullName"
                                        placeholder="Enter your full name"
                                        required
                                    >

                                </div>

                            </div>



                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold"
                                >

                                    Email Address

                                </label>


                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="fa-solid fa-envelope"></i>

                                    </span>


                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        placeholder="Enter your email"
                                        required
                                    >

                                </div>

                            </div>



                            <!-- PHONE -->

                            <div class="mb-3">

                                <label
                                    for="phone"
                                    class="form-label fw-semibold"
                                >

                                    Phone Number

                                </label>


                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="fa-solid fa-phone"></i>

                                    </span>


                                    <input
                                        type="tel"
                                        class="form-control"
                                        id="phone"
                                        placeholder="Enter 10 digit phone number"
                                        maxlength="10"
                                        required
                                    >

                                </div>

                            </div>



                            <!-- EDUCATION -->

                            <div class="mb-3">

                                <label
                                    for="education"
                                    class="form-label fw-semibold"
                                >

                                    Education

                                </label>


                                <select
                                    class="form-select"
                                    id="education"
                                    required
                                >

                                    <option value="">

                                        Select your education

                                    </option>


                                    <option value="10th">

                                        10th

                                    </option>


                                    <option value="12th">

                                        12th

                                    </option>


                                    <option value="diploma">

                                        Diploma

                                    </option>


                                    <option value="undergraduate">

                                        Undergraduate

                                    </option>


                                    <option value="postgraduate">

                                        Postgraduate

                                    </option>

                                </select>

                            </div>



                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label fw-semibold"
                                >

                                    Password

                                </label>


                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="fa-solid fa-lock"></i>

                            <!-- TERMS -->

<!-- ================= REGISTRATION JAVASCRIPT ================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("registrationForm");


    if (!form) {

        console.error("registrationForm not found!");

        return;

    }


    form.addEventListener("submit", async function (event) {

        event.preventDefault();



        // ================= GET FORM VALUES =================

        const name =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const education =
            document.getElementById("education").value;

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const terms =
            document.getElementById("terms").checked;



        // ================= VALIDATION =================

        if (
            !name ||
            !email ||
            !phone ||
            !education ||
            !password
        ) {

            alert("Please fill in all fields.");

            return;

        }


        // Phone validation

        if (
            phone.length !== 10 ||
            !/^[0-9]+$/.test(phone)
        ) {

            alert("Please enter a valid 10 digit phone number.");

            return;

        }


        // Password validation

        if (password !== confirmPassword) {

            alert("Passwords do not match!");

            return;

        }


        // Terms validation

        if (!terms) {

            alert("Please accept the terms and conditions.");

            return;

        }



        // ================= SEND DATA TO FLASK =================

        try {

            const response = await fetch(
                "http://127.0.0.1:5000/register",
                {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    body: JSON.stringify({

                        name: name,

                        email: email,

                        phone: phone,

                        education: education,

                        password: password

                    })

                }
            );



            // Get response from Flask

            const data = await response.json();


            console.log(
                "Registration response:",
                data
            );



            // ================= SUCCESS =================

            if (response.ok && data.success) {

                alert("Registration successful!");


                // Store user information

                if (data.user) {

                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );

                }


                // Go to login page

                window.location.href =
                    "login.html";

            }


            // ================= SERVER ERROR =================

            else {

                alert(
                    data.message ||
                    "Registration failed."
                );

            }

        }


        // ================= CONNECTION ERROR =================

        catch (error) {

            console.error(
                "Registration Error:",
                error
            );


            alert(
                "Unable to connect to Flask server.\n\n" +
                "Please make sure Flask is running on:\n" +
                "http://127.0.0.1:5000"
            );

        }

    });

});

</script>
