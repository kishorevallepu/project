<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose New Password - CareerGuide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="card border-0 shadow-sm w-100 auth-narrow-card">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 fw-bold mb-2">Choose a new password</h1>
                <p class="text-muted mb-4">Use at least 8 characters. This reset link can only be used once.</p>
                <div id="resetMessage" class="alert d-none" role="status"></div>
                <form id="resetPasswordForm">
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New password</label>
                        <input id="newPassword" class="form-control" type="password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm new password</label>
                        <input id="confirmPassword" class="form-control" type="password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <button id="savePasswordButton" class="btn btn-primary w-100" type="submit">Update password</button>
                </form>
                <div class="text-center mt-4"><a href="login.html">Back to login</a></div>
            </div>
        </section>
    </main>
    <script>
        const resetToken = new URLSearchParams(window.location.search).get("token");
        const resetForm = document.getElementById("resetPasswordForm");
        const resetMessage = document.getElementById("resetMessage");

        if (!resetToken) {
            resetForm.hidden = true;
            resetMessage.textContent = "This reset link is missing its token. Request a new link.";
            resetMessage.className = "alert alert-danger";
        }

        resetForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const password = document.getElementById("newPassword").value;
            if (password !== document.getElementById("confirmPassword").value) {
                resetMessage.textContent = "The passwords do not match.";
                resetMessage.className = "alert alert-danger";
                return;
            }

            const button = document.getElementById("savePasswordButton");
            button.disabled = true;
            resetMessage.className = "alert d-none";

            try {
                const response = await fetch("http://127.0.0.1:5000/password-reset/confirm", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: resetToken, password: password })
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Could not reset the password.");
                }

                resetForm.hidden = true;
                resetMessage.textContent = data.message;
                resetMessage.className = "alert alert-success";
            } catch (error) {
                resetMessage.textContent = error instanceof TypeError
                    ? "Could not connect to the backend. Make sure Flask is running."
                    : error.message;
                resetMessage.className = "alert alert-danger";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
