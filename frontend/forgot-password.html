<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CareerGuide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="card border-0 shadow-sm w-100 auth-narrow-card">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 fw-bold mb-2">Reset your password</h1>
                <p class="text-muted mb-4">Enter your account email and we’ll send a one-time reset link.</p>
                <div id="resetMessage" class="alert d-none" role="status"></div>
                <form id="forgotPasswordForm">
                    <label for="resetEmail" class="form-label">Email address</label>
                    <input id="resetEmail" class="form-control mb-3" type="email" autocomplete="email" required>
                    <button id="requestResetButton" class="btn btn-primary w-100" type="submit">Send reset link</button>
                </form>
                <div class="text-center mt-4"><a href="login.html">Back to login</a></div>
            </div>
        </section>
    </main>
    <script>
        document.getElementById("forgotPasswordForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const button = document.getElementById("requestResetButton");
            const message = document.getElementById("resetMessage");
            button.disabled = true;
            message.className = "alert d-none";

            try {
                const response = await fetch("http://127.0.0.1:5000/password-reset/request", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: document.getElementById("resetEmail").value.trim() })
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Could not request a reset link.");
                }

                message.textContent = data.message;
                message.className = "alert alert-success";
                document.getElementById("forgotPasswordForm").reset();
            } catch (error) {
                message.textContent = error instanceof TypeError
                    ? "Could not connect to the backend. Make sure Flask is running."
                    : error.message;
                message.className = "alert alert-danger";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
