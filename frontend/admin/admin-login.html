<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - CareerGuide</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="css/style.css">

    <style>

        body {
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #212529,
                #343a40
            );
        }

        .admin-container {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .admin-card {

            width: 100%;

            max-width: 450px;

            border: none;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.3);

        }

        .admin-icon {

            width: 85px;

            height: 85px;

            margin: auto;

            border-radius: 50%;

            background: #212529;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 35px;

        }

        .form-control {

            padding: 12px;

            border-radius: 10px;

        }

        .input-group-text {

            background: #f1f3f5;

            border-radius: 10px 0 0 10px;

        }

        .admin-btn {

            padding: 12px;

            border-radius: 10px;

            font-weight: 600;

        }

        .back-link {

            text-decoration: none;

        }

    </style>

</head>


<body>


<!-- ================================================= -->
<!-- ADMIN LOGIN -->
<!-- ================================================= -->

<div class="admin-container">

    <div class="card admin-card">

        <div class="card-body p-4 p-md-5">


            <!-- ADMIN ICON -->

            <div class="text-center mb-4">

                <div class="admin-icon mb-3">

                    <i class="fa-solid fa-user-shield"></i>

                </div>

                <h2 class="fw-bold">

                    Admin Login

                </h2>

                <p class="text-muted">

                    CareerGuide Administration Panel

                </p>

            </div>


            <!-- ERROR MESSAGE -->

            <div id="adminError"
                 class="alert alert-danger d-none">

                Invalid administrator credentials.

            </div>


            <!-- SUCCESS MESSAGE -->

            <div id="adminSuccess"
                 class="alert alert-success d-none">

                Login successful. Redirecting...

            </div>


            <!-- LOGIN FORM -->

            <form id="adminLoginForm">


                <!-- EMAIL -->

                <div class="mb-3">

                    <label for="adminEmail"
                           class="form-label fw-semibold">

                        Admin Email

                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="fa-solid fa-envelope"></i>

                        </span>

                        <input type="email"
                               id="adminEmail"
                               class="form-control"
                               placeholder="Enter admin email"
                               required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-4">

                    <label for="adminPassword"
                           class="form-label fw-semibold">

                        Password

                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="fa-solid fa-lock"></i>

                        </span>

                        <input type="password"
                               id="adminPassword"
                               class="form-control"
                               placeholder="Enter admin password"
                               required>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit"
                        id="loginButton"
                        class="btn btn-dark
                               admin-btn
                               w-100">

                    <i class="fa-solid fa-right-to-bracket me-2"></i>

                    Admin Login

                </button>


            </form>


            <!-- BACK TO HOME -->

            <div class="text-center mt-4">

                <a href="index.html"
                   class="back-link text-secondary">

                    <i class="fa-solid fa-arrow-left me-1"></i>

                    Back to Home

                </a>

            </div>


        </div>

    </div>

</div>


<!-- ================================================= -->
<!-- ADMIN LOGIN JAVASCRIPT -->
<!-- ================================================= -->

<script>

document.getElementById("adminLoginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        /* ===============================
           GET FORM VALUES
           =============================== */

        const email =
            document.getElementById(
                "adminEmail"
            ).value.trim();


        const password =
            document.getElementById(
                "adminPassword"
            ).value;


        const error =
            document.getElementById(
                "adminError"
            );


        const success =
            document.getElementById(
                "adminSuccess"
            );


        const button =
            document.getElementById(
                "loginButton"
            );


        /* ===============================
           HIDE OLD MESSAGES
           =============================== */

        error.classList.add("d-none");

        success.classList.add("d-none");


        const originalButtonContent = button.innerHTML;
        button.disabled = true;
        button.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

        try {

            const response = await fetch(
                "http://127.0.0.1:5000/admin/login",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Admin login failed");
            }

            success.classList.remove("d-none");
            window.location.href = "dashboard.html";

        } catch (loginError) {

            error.textContent = loginError instanceof TypeError
                ? "Could not connect to the backend. Make sure the Flask server is running."
                : loginError.message;
            error.classList.remove("d-none");
            document.getElementById("adminPassword").value = "";
            button.disabled = false;
            button.innerHTML = originalButtonContent;

        }

    });


</script>


</body>

</html>
